[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-prompt-guard"
version = "0.1.0"
description = "Zero-dependency Indirect Prompt-Injection & Untrusted Evidence Firewall for LLM and GRC Pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zayed Alnuaimi"}]

[project.scripts]
aegis = "aegis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
